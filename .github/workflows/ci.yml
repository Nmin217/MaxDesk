# Runs on every push to GitHub. Two jobs:
#   module-test : compiles the roboRIO bench test program (needs the FRC/REV download servers, which GitHub can reach)
#   tests       : scripts/verify.sh, the same checks as on a laptop (sim scenarios, bridge, Pi runtime, Java core)
# A third, "full", runs scripts/verify.sh --full (adds ~15 min of long sim runs) when started by hand from the Actions tab.
name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      full:
        description: "Also run the long simulations (verify.sh --full)"
        type: boolean
        default: false

jobs:
  module-test:
    name: Build roboRIO bench test (firmware/module-test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: firmware/module-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - run: chmod +x gradlew
      - run: ./gradlew build --no-daemon --stacktrace

  tests:
    name: Simulator, bridge, Pi runtime, Java core (verify.sh)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: bridge/sim_core.js matches the simulator
        run: python3 scripts/sync_sim_core.py --check
      - name: verify.sh
        run: bash scripts/verify.sh

  full:
    name: Long simulations (verify.sh --full)
    if: github.event_name == 'workflow_dispatch' && inputs.full
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: bash scripts/verify.sh --full
